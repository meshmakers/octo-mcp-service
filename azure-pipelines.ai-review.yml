# AI review of pull requests, SHADOW MODE (AB#8506, Feature AB#8503; concept docs/CONCEPT-AI-REVIEW-BOT.md in
# meshmakers-infrastructure). Separate pipeline from the CI (azure-pipelines.yml): it does not build, it reads the pull
# request diff through the GitHub API, runs a fresh review model session and posts ONE COMMENT review with inline findings
# as the GitHub App meshmakers-review-bot, plus a "would approve / would not approve" verdict. It never approves.
#
# Enablement: the Azure DevOps pipeline definition for this file needs the credentials of AB#8504 (GitHub App, Vault paths,
# variable group "ai-review"); a maintainer creates/enables it (octo-pipeline-templates README, section "AI review", "Enable").
#
# Kill switch without a PR: variable AI_REVIEW_MODE=off (global) or AI_REVIEW_MODE_OCTO_MCP_SERVICE=off in the group "ai-review".

name: ai-review-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pr:
  autoCancel: true          # a new push cancels the running review of the same pull request
  drafts: false             # drafts are skipped
  branches:
    include:
      - main

resources:
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.14.0     # template tag of AB#8506

variables:
  - group: ai-review                 # AiReviewVaultAddr, AiReviewVaultRoleId, AiReviewVaultSecretId, kill-switch variables

pool:
  name: ai-review                    # dedicated pool (concept section 4; AB#8504/Odysseus); no CI slot is used

steps:
  - template: templates/steps/ai-review.yml@pipelineTemplates
    parameters:
      mode: shadow
