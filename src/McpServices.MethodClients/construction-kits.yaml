"$schema": "https://schemas.meshmakers.cloud/construction-kit-meta.schema.json"
# AB#8440: the source generator (Meshmakers.Octo.Sdk.SourceGeneration) emits the System.Identity DTOs and the CK method
# client RtUserMethodClient from this range; the role tools call User.AddRole / User.RemoveRole through it.
# 3.2.0 is the first System.Identity version with all User methods of identity wave 1 (octo-sdk
# docs/method-client-migration-guide.md, "Identity wave 1").
# System.Communication 4.19.0 is the first version with every method of communication wave 3 (pipeline, data
# flow, workload, deployment site and trigger operations); its types derive from System/Configuration, so System is
# imported too (octo-sdk docs/method-client-migration-guide.md, "Communication wave 3").
# System.Identity 3.9.0 adds Client.SetMirrorRoles-1 and Client.MirrorRoleNames (set_client_mirror_roles, get_client_mirror_roles).
imports:
  - System-[2.7,3.0)
  - System.Communication-[4.19,5.0)
  - System.Identity-[3.9,4.0)
